submission:
  title: "FabGuard — Semiconductor Yield Risk & Root-Cause Copilot with IBM Bob"  # REQUIRED

  problem_statement: >                              # REQUIRED — 1-3 sentences. What problem? Who has it?
    At advanced semiconductor nodes (3nm/5nm), a 1% yield drop costs tens of millions of dollars per month across thousands of complex process steps. Yield and process integration engineers spend weeks manually correlating siloed sensor telemetry, defect inspection maps, and equipment logs, causing severe alert fatigue and delayed excursion resolution.

  solution_summary: >                               # REQUIRED — 1-3 sentences. What did you build?
    FabGuard is an intelligent semiconductor fab operations copilot that pairs automated Statistical Process Control (SPC) and spatial defect pattern clustering with an active IBM Bob Model Context Protocol (MCP) server powered by IBM watsonx.ai Granite 3.0. Engineers converse naturally with IBM Bob to diagnose excursions, pinpoint suspect equipment with calibrated statistical probabilities, receive actionable standard operating procedures, and hold at-risk in-progress batches before physical yield loss occurs.

  key_features:                                     # REQUIRED — List 3 to 5 specific features you implemented
    - "Automated SPC & DBSCAN Spatial Wafer Pattern Recognition (edge-ring, center cluster, scratch, donut)"
    - "Multi-factor statistical root-cause attribution ranking suspect equipment with calibrated probabilities"
    - "Native Model Context Protocol (MCP) server empowering IBM Bob with 4 direct diagnostic tools"
    - "IBM watsonx.ai Granite 3.0 enterprise reasoning with automated multi-tier LLM failover"
    - "Proactive in-progress batch risk assessment detecting early chamber drift via normalized parameter vectors"

  tech_stack:
    languages: ["Python", "JavaScript", "SQL", "HTML/CSS"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "Three.js / React Three Fiber", "Model Context Protocol (MCP)", "ibm-watsonx-ai", "scikit-learn"]
    ibm_technologies: ["IBM Bob", "IBM watsonx.ai", "IBM Granite 3.0", "Model Context Protocol (MCP)"]
    databases: ["SQLite (bob_fab.db)"]
    other: ["DBSCAN", "Groq", "Google Gemini", "Pytest", "GitHub Actions"]

  what_we_are_most_proud_of: >                      # Optional but recommended — guides judges to your best work
    Making IBM Bob an active, load-bearing participant via the Model Context Protocol (MCP). Rather than just a passive chat assistant, IBM Bob directly invokes our analytics tools over stdio to query fab sensor databases, classify spatial defect patterns, evaluate chamber drift, and formulate statistically grounded explanations with strict Design of Experiments (DOE) caveats.

  known_limitations: >                              # Optional but recommended — be honest about gaps
    Ingestion currently connects to a SQLite semiconductor fab schema rather than a live streaming SECS/GEM (SEMI E30/E37) or OPC-UA fab bus. Spatial defect clustering parameters are calibrated for 300mm wafer coordinate geometries and would require retuning for 200mm wafer lines.

