services:
  - type: web
    name: fabguard-backend
    runtime: python
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: PYTHONPATH
        value: /opt/render/project/src
